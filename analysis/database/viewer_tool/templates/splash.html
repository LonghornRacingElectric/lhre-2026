<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splash Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    .banner {
      width: 100%;
      height: 50px;
      background-color: #333;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 1.2em;
      font-weight: bold;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }
    .left-container {
      display: flex;
      align-items: center;
      gap: 5px; /* Reduce gap to bring logo closer */
      flex-grow: 1; /* Allow it to expand and keep alignment */
    }
    .logo {
      height: 30px;
      width: auto;
      max-width: 70px;
    }
    .time-container {
      display: flex;
      gap: 15px;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 90%;
      height: calc(100vh - 90px);
      margin-top: 60px;
      margin-bottom: 30px;
    }
    .box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease-in-out;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    .box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 15px;
      filter: brightness(60%);
      transition: filter 0.3s ease-in-out;
    }
    .box:hover img {
      filter: brightness(80%);
    }
    .box span {
      position: absolute;
      color: white;
      font-size: 2em;
      font-weight: bold;
      text-align: center;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
    }
    .menu-btn {
      font-size: 1.5em; /* Reduce size */
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      margin-right: 10px;
      display: flex;
      align-items: center; /* Center vertically */
      justify-content: center;
      height: 100%; /* Match banner height */
    }

    /* Sidebar Menu */
    .sidebar {
      position: fixed;
      top: 0;
      left: -250px; /* Initially hidden */
      width: 250px;
      height: 100%;
      background-color: #222;
      padding-top: 60px;
      transition: left 0.3s ease-in-out;
      z-index: 1100;
    }
    /* Sidebar Menu Links */
    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      font-size: 1.5em;
      padding: 15px 20px;
      transition: background 0.3s;
    }
    .sidebar a:hover {
      background-color: #444;
    }
    /* Overlay to close menu when clicking outside */
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
    }

    /* Responsive layout: If screen is taller than it is wide (portrait mode), stack the boxes vertically */
    @media (max-aspect-ratio: 1/1) {
      .container {
        grid-template-columns: 1fr; /* Single column layout */
        grid-template-rows: repeat(3, 1fr);
        height: auto; /* Allow it to expand based on content */
        margin-top: 70px;
        margin-bottom: 20px;
      }
      .box {
        height: 30vh; /* Set each box to be a third of the screen height */
      }
    }

    /* Media Query for smaller screens */
    @media (max-width: 600px) {
      .banner {
        font-size: 1em;
        padding: 0 10px;
      }
      .menu-btn {
        font-size: 1.2em;
      }
      .left-container span,
      .time-container span {
        font-size: 0.9em;
      }
    }
  </style>
  <script>
    function updateTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('current-time').textContent = `${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateTime, 1000);
    window.onload = updateTime;
    function toggleMenu() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");

      if (sidebar.style.left === "0px") {
        sidebar.style.left = "-250px";
        overlay.style.display = "none";
      } else {
        sidebar.style.left = "0px";
        overlay.style.display = "block";
      }
    }
    // Close the menu when clicking outside
    function closeMenu() {
      document.getElementById("sidebar").style.left = "-250px";
      document.getElementById("overlay").style.display = "none";
    }
  </script>
</head>
<body>
  <div class="banner">
    <button class="menu-btn" onclick="toggleMenu()">☰</button> <!-- Menu Button -->
    <div class="left-container">
      <img src="{{ url_for('static', filename='images/telem_logo.png') }}" alt="Logo" class="logo">
      <span> Welcome, {{ current_user.username }}</span>
    </div>
    <div class="time-container">
      <span>{{ current_date }}</span>
      <span id="current-time"></span>
    </div>
  </div>

  <div class="container">
    <div class="box" onclick="location.href='{{ url_for('index') }}'">
      <img src="{{ url_for('static', filename='images/car.png') }}" alt="Driveday">
      <span>Driveday Page</span>
    </div>
    <div class="box" onclick="location.href='{{ url_for('vcu_parameters') }}'">
      <img src="{{ url_for('static', filename='images/tune.png') }}" alt="Texas Tune">
      <span>Texas Tune</span>
    </div>
    <div class="box" onclick="location.href='{{ url_for('dashboards') }}'">
      <img src="{{ url_for('static', filename='images/graph.png') }}" alt="Life Like Visuals">
      <span>Grafana & Database</span>
    </div>
  </div>
  <!-- Sidebar Menu -->
  <div id="sidebar" class="sidebar">
    <a href="{{ url_for('splash') }}">Home</a>
    <a href="{{ url_for('logout') }}">Logout</a>
  </div>

  <!-- Click outside to close menu -->
  <div id="overlay" class="overlay" onclick="closeMenu()"></div>
</body>
</html>
