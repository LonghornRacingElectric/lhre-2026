{% extends 'base.html' %}

{% block head %}
<title>Texas Tune</title>
<script src="{{ url_for('static', filename='js/adjustableChart.js') }}"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.3/dist/Chart.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}" />
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        width: 100vw;
    }
    .banner {
        width: 100%;
        height: 50px;
        background-color: #333;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
        font-size: 1.2em;
        font-weight: bold;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
    }
    .left-container {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-grow: 1;
    }
    .logo {
        height: 30px;
        width: auto;
        max-width: 70px;
    }
    .time-container {
        display: flex;
        gap: 15px;
    }
    .menu-btn {
        font-size: 1.5em;
        background: none;
        border: none;
        color: white;
        cursor: pointer;
        margin-right: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
    }
    .sidebar {
        position: fixed;
        top: 0;
        left: -250px;
        width: 250px;
        height: 100%;
        background-color: #222;
        padding-top: 60px;
        transition: left 0.3s ease-in-out;
        z-index: 1100;
    }
    .sidebar a {
        display: block;
        color: white;
        text-decoration: none;
        font-size: 1.5em;
        padding: 15px 20px;
        transition: background 0.3s;
    }
    .sidebar a:hover {
        background-color: #444;
    }
    .overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
    }
    .content {
        margin-top: 60px;
        padding: 20px;
        width: 100%;
    }
</style>

<script>
    function updateTime() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('current-time').textContent = `${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateTime, 1000);
    window.onload = updateTime;

    function toggleMenu() {
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");

        if (sidebar.style.left === "0px") {
            sidebar.style.left = "-250px";
            overlay.style.display = "none";
        } else {
            sidebar.style.left = "0px";
            overlay.style.display = "block";
        }
    }

    function closeMenu() {
        document.getElementById("sidebar").style.left = "-250px";
        document.getElementById("overlay").style.display = "none";
    }
</script>
{% endblock %}

{% block body %}

<!-- Banner -->
<div class="banner">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="left-container">
        <img src="{{ url_for('static', filename='images/telem_logo.png') }}" alt="Logo" class="logo">
        <span> Welcome, {{ current_user.username }}</span>
    </div>
    <div class="time-container">
        <span>{{ current_date }}</span>
        <span id="current-time"></span>
    </div>
</div>

<!-- Sidebar -->
<div id="sidebar" class="sidebar">
    <a href="{{ url_for('splash') }}">Home</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</div>
<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<!-- Main Content -->

<script>
    appear("#APPS")

    var currentPage = "#APPS";

    function appear(elem) {
        currentPage = elem

        document.getElementById("#APPS").style.display = "none"
        document.getElementById("#BSE").style.display = "none"
        document.getElementById("#STOMPP").style.display = "none"
        document.getElementById("#TORQUE_MAP").style.display = "none"
        document.getElementById("#PRNDL").style.display = "none"
        document.getElementById("#TRACTION_CONTROL").style.display = "none"
        document.getElementById("#STEERING").style.display = "none"

        document.getElementById(elem).style.display = "flex"
    }

    function savePage(p) {
        if (p === 'curr') {
            p = currentPage
        }
        
        let page = document.getElementById(p).innerHTML
        let v = [];


        let payload = {
            "category": p
        }

        let re = /input.type=\"+\w+".id="+\w+/g;
        let l = page.match(re)

        for (let i = 0; i < l.length; ++i) {
            if (l[i].includes("number")) {
                l[i] = l[i].substr(l[i].indexOf("id=\"") + 4)
                v[i] = document.getElementById(l[i]).value

            } else if (l[i].includes("checkbox")) {
                console.log("check");
                l[i] = l[i].substr(l[i].indexOf("id=\"") + 4)
                v[i] = document.getElementById(l[i]).checked
            }
            payload[l[i]] = v[i]
        }

        re = /table.\w+.........\w+/g;
        l = page.match(re)
        if(l != null){
        let table = null
        for (let k = 0; k < l.length; ++k) {
            l[k] = l[k].substr(l[k].indexOf("id=\"") + 4)
            table = document.getElementById(l[k])

            let data = [];
            for (let i = 1; i < table.rows.length; i++) {
                let tableRow = table.rows[i];
                let rowData = [];
                for (let j = 0; j < tableRow.cells.length; j++) {
                    rowData.push(tableRow.cells[j].innerHTML);
                }
                data.push(rowData);
            }
            payload[l[k]] = data
        }
    }

        let xhr = new XMLHttpRequest();
        xhr.open('POST', 'https://telemetry.servebeer.com:5000/tune_data');
        xhr.setRequestHeader("Content-Type", "application/json; charset=UTF-8")
        xhr.send(JSON.stringify(payload));

    }

    function saveAll() {
        savePage("#APPS")
        savePage("#BSE")
        savePage("#STOMPP")
        savePage("#TORQUE_MAP")
        savePage("#PRNDL")
        savePage("#TRACTION_CONTROL")
        savePage("#STEERING")

    }


</script>
