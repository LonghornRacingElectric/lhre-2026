version: 2.1

jobs:
  bazel-build-test:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true

    environment:
      BAZELISK_VERSION: "1.19.0"

    steps:
      - checkout

      - run:
          name: Initialize Submodules
          command: git submodule update --init --recursive

      - run:
          name: Install Bazelisk
          command: |
            sudo curl -L "https://github.com/bazelbuild/bazelisk/releases/download/v${BAZELISK_VERSION}/bazelisk-linux-amd64" -o /usr/local/bin/bazel
            sudo chmod +x /usr/local/bin/bazel
            bazel version

      - restore_cache:
          keys:
            - v1-bazel-cache-{{ checksum "WORKSPACE" }}
            - v1-bazel-cache-

      - run:
          name: Build All
          command: |
            bazel build //... \
              --config=ci \
              --remote_header=x-buildbuddy-api-key=${BUILD_BUDDY_API_KEY}

      - run:
          name: Run Unit Tests (no Docker required)
          command: |
            bazel test //... \
              --config=ci \
              --remote_header=x-buildbuddy-api-key=${BUILD_BUDDY_API_KEY} \
              --test_output=errors \
              --test_tag_filters=-integration,-docker,-requirements \
              --test_env=POSTGRES_USER=${POSTGRES_USER} \
              --test_env=POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

      - save_cache:
          key: v1-bazel-cache-{{ checksum "WORKSPACE" }}
          paths:
            - "~/.cache/bazel"
          when: always

      - run:
          name: Create Docker network and volumes
          command: |
            docker network create telemetry_network || true
            docker volume create grafana_storage || true
            docker volume create telemetry_db || true

      - run:
          name: Create .env file for Docker
          command: |
            mkdir -p telemtry 
            cat > telemtry/.env \<< EOF
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            EOF

      - run:
          name: Start Kafka services
          working_directory: telemtry/stack/kafka
          command: docker compose up -d --build --wait

      - run:
          name: Start Ingest services
          working_directory: telemtry/stack/ingest
          command: docker compose up -d --build --wait

      - run:
          name: Wait for services to be healthy
          command: |
            echo "Waiting for services to be ready..."
            sleep 10
            docker ps

      - run:
          name: Run Integration Tests
          command: |
            bazel test //telemtry/... \
              --test_output=errors \
              --config=ci \
              --remote_header=x-buildbuddy-api-key=${BUILD_BUDDY_API_KEY} \
              --test_tag_filters=integration \
              --test_env=POSTGRES_USER=${POSTGRES_USER} \
              --test_env=POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

      - run:
          name: Teardown Docker services
          when: always
          command: |
            cd telemtry/stack/ingest && docker compose down -v --remove-orphans || true
            cd telemtry/stack/kafka && docker compose down -v --remove-orphans || true
            docker network rm telemetry_network || true
            rm -f telemtry/.env || true

workflows:
  version: 2
  presubmit:
    jobs:
      - bazel-build-test:
          context:
            - telemetry-secrets
