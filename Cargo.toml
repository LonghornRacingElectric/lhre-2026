[workspace]

[package]
name = "lhre-2026"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.10"


[target.'cfg(target_os = "linux")'.dependencies]
socketcan = "3"

[[bin]]
name = "my_binary"
path = "main.rs"