apiVersion: 1

datasources:
  - name: Real Time Data
    uid: real-time-data
    type: hamedkarbasi93-kafka-datasource
    access: proxy
    isDefault: false

    jsonData:
      bootstrapServers: "kafka:9092"
      timestampMode: "event"        # event | received
      flattenDepth: 5
      maxFieldsPerMessage: 1000

    secureJsonData:
      sslmode: "disable"