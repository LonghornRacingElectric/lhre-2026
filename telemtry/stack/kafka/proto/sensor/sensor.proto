    float hvc_last_seen_s = 3;
    float inverter_last_seen_s = 4;
    float pdu_last_seen_s = 5;
    float tsm_last_seen_s = 6;
    float usm_last_seen_s = 7;
    float vcu_last_seen_s = 8;
}
