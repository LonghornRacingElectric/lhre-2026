syntax = "proto3";

package sensor;

option go_package = "github.com/LonghornRacingElectric/lhre-2026/telemtry/stack/kafka/proto/sensor;sensor";

message SensorData {
    int64 time = 1;
    int64 packet_id = 2;
    Dynamics dynamics = 3;
    Controls controls = 4;
    Pack pack = 5;
    DiagnosticsHigh diagnostics_high = 6;
    DiagnosticsLow diagnostics_low = 1001;
    Thermal thermal = 1002;
}

message Dynamics {
    float steer_col_angle = 7;
    float fl_steer_angle = 8;
    float fr_steer_angle = 9;
    repeated float fl_sprung_accel = 10;
    repeated float fr_sprung_accel = 11;
    repeated float bl_sprung_accel = 12;
    repeated float br_sprung_accel = 13;
    repeated float fl_unsprung_accel = 14;
    repeated float fr_unsprung_accel = 15;
    repeated float bl_unsprung_accel = 16;
    repeated float br_unsprung_accel = 17;
    repeated float fl_sprung_ang_rate = 18;
    repeated float fr_sprung_ang_rate = 19;
    repeated float bl_sprung_ang_rate = 20;
    repeated float br_sprung_ang_rate = 21;
    repeated float cent_mass_accel = 22;
    repeated float cent_mass_ang_rate = 23;
    float flw_speed = 24;
    float frw_speed = 25;
    float blw_speed = 26;
    float brw_speed = 27;
    float fl_ride_height = 28;
    float fr_ride_height = 29;
    float bl_ride_height = 30;
    float br_ride_height = 31;
    float fl_strain_gauge_v = 32;
    float fr_strain_gauge_v = 33;
    float bl_strain_gauge_v = 34;
    float br_strain_gauge_v = 35;
    float fl_pushrod_stress = 36;
    float fr_pushrod_stress = 37;
    float bl_pushrod_stress = 38;
    float br_pushrod_stress = 39;
    float fl_spring_displace = 40;
    float fr_spring_displace = 41;
    float bl_spring_displace = 42;
    float br_spring_displace = 43;
    float dash_speed = 44;
    repeated float f_gps = 45;
    repeated float b_gps = 46;
    float f_gps_velocity = 47;
    float b_gps_velocity = 48;
    float f_gps_heading = 49;
    float b_gps_heading = 50;
}

message Controls {
    float apps1_v = 51;
    float apps2_v = 52;
    float apps1_t = 53;
    float apps2_t = 54;
    float accel_pedal_t = 55;
    float bpps1_v = 56;
    float bpps2_v = 57;
    float bpps1_t = 58;
    float bpps2_t = 59;
    float brake_pedal_t = 60;
    float bse1_v = 61;
    float bse2_v = 62;
    float bse3_v = 63;
    float brake_pressure_f = 64;
    float brake_pressure_rbll = 65;
    float brake_pressure_rall = 66;
    float brake_bias = 67;
}

message Pack {
    float hv_pack_v = 68;
    float hv_tractive_v = 69;
    float hv_c = 70;
    float lv_v = 71;
    float lv_c = 72;
    int32 contactor_state = 73;
    float avg_cell_v = 74;
    float avg_cell_temp = 75;
}

message DiagnosticsHigh {
    bool apps1_disconnect = 76;
    bool apps2_disconnect = 77;
    bool apps1_out_range = 78;
    bool apps2_out_range = 79;
    bool apps_mismatch = 80;
    bool apps_implause = 81;
    bool bpps1_disconnect = 82;
    bool bpps2_disconnect = 83;
    bool bpps1_out_range = 84;
    bool bpps2_out_range = 85;
    bool bpps_mismatch = 86;
    bool bse1_disconnect = 87;
    bool bse2_disconnect = 88;
    bool bse1_out_range = 89;
    bool bse2_out_range = 90;
}

message DiagnosticsLow {
    bool batt_over_c = 1003;
    int32 cell_over_v = 1004;
    int32 cell_under_v = 1005;
    int32 cell_open_wire = 1006;
    int32 cell_damaged = 1007;
    int32 thermistor_damaged = 1008;
    bool bmb_comm_error = 1009;
    bool imd_gnd_isolation_error = 1010;
    bool tractive_contactor_error = 1011;
    bool precharge_fail = 1012;
    bool cells_v_balanced = 1013;
    float cell_min_v = 1014;
    float cell_max_v = 1015;
    float batt_v = 1016;
    float batt_c = 1017;
    float hv_soc = 1018;
    bool shutdown_leg1 = 1019;
    bool shutdown_leg2 = 1020;
    bool shutdown_leg3 = 1021;
    bool shutdown_leg4 = 1022;
    bool shutdown_leg5 = 1023;
    bool shutdown_leg6 = 1024;
    bool shutdown_leg7 = 1025;
    bool shutdown_leg8 = 1026;
    bool shutdown_leg9 = 1027;
    bool shutdown_leg10 = 1028;
    bool shutdown_leg11 = 1029;
    bool shutdown_leg12 = 1030;
    repeated float cells_temps = 1031;
    repeated float cells_v = 1032;
}

message Thermal {
    float motor_loop_flow_rate = 1033;
    float motor_loop_motor_temp = 1034;
    float motor_loop_inverter_temp = 1035;
    float motor_loop_rad_temp = 1036;
    float motor_loop_rad_fan_speed = 1037;
    float ambient_temp = 1038;
    float batt_loop_batt_temp = 1039;
    float batt_loop_rad_temp = 1040;
    float batt_loop_rad_fan_speed = 1041;
    float motor_temp = 1042;
    float inverter_temp = 1043;
    float bus_bar_temp1 = 1044;
    float bus_bar_temp2 = 1045;
    float bus_bar_temp3 = 1046;
    float precharge_r_temp = 1047;
    float discharge_r_temp = 1048;
    bool batt_over_temp = 1049;
}

// Angelique messages
message AngeliqueSensorData {
    int64 time = 1;
    int64 packet_id = 2;
    AngeliqueDynamics dynamics = 3;
    AngeliqueControls controls = 4;
    AngeliquePack pack = 5;
    AngeliqueDiagnostics diagnostics = 6;
    AngeliqueThermal thermal = 7;
}

message AngeliqueDynamics {
    float torque_request = 8;
    repeated float vcu_position = 9;
    repeated float vcu_velocity = 10;
    repeated float vcu_accel = 11;
    repeated float gps = 12;
    float gps_velocity = 13;
    float gps_heading = 14;
    repeated float body1_accel = 15;
    repeated float body2_accel = 16;
    repeated float body3_accel = 17;
    repeated float flw_accel = 18;
    repeated float frw_accel = 19;
    repeated float blw_accel = 20;
    repeated float brw_accel = 21;
    repeated float body1_gyro = 22;
    repeated float body2_gyro = 23;
    repeated float body3_gyro = 24;
    float flw_speed = 25;
    float frw_speed = 26;
    float blw_speed = 27;
    float brw_speed = 28;
    float inverter_v = 29;
    float inverter_c = 30;
    int32 inverter_rpm = 31;
    float inverter_torque = 32;
}

message AngeliqueControls {
    bytes vcu_flags = 33;
    string vcu_flags_json = 34;
    float apps1_v = 35;
    float apps2_v = 36;
    float bse1_v = 37;
    float bse2_v = 38;
    float sus1_v = 39;
    float sus2_v = 40;
    float steer_v = 41;
}

message AngeliquePack {
    float hv_pack_v = 42;
    float hv_tractive_v = 43;
    float hv_c = 44;
    float lv_v = 45;
    float lv_c = 46;
    int32 contactor_state = 47;
    float avg_cell_v = 48;
    float avg_cell_temp = 49;
}

message AngeliqueDiagnostics {
    bytes current_errors = 50;
    string current_errors_json = 51;
    bytes latching_faults = 52;
    string latching_faults_json = 53;
    repeated float cells_v = 54;
    float hv_charge_state = 55;
    float lv_charge_state = 56;
}

message AngeliqueThermal {
    repeated int32 cells_temp = 57;
    int32 ambient_temp = 58;
    int32 inverter_temp = 59;
    int32 motor_temp = 60;
    int32 water_motor_temp = 61;
    int32 water_inverter_temp = 62;
    int32 water_rad_temp = 63;
    int32 rad_fan_set = 64;
    int64 rad_fan_rpm = 65;
    int32 batt_fan_set = 66;
    int32 batt_fan_rpm = 67;
    int32 flow_rate = 68;
}

// Orion messages
message OrionSensorData {
    int64 time = 1;
    int64 packet_id = 2;
    OrionDynamics dynamics = 3;
    OrionControls controls = 4;
    OrionPack pack = 5;
    OrionDiagnosticsHigh diagnostics_high = 6;
    OrionDiagnosticsLow diagnostics_low = 7;
    OrionThermal thermal = 8;
    OrionBoardStatus board_status = 9;
}

message OrionDynamics {
    repeated float gps = 1;
    repeated float gps_imu = 2;
    float gps_speed = 3;
    repeated float bl_unsprung_accel = 4;
    repeated float br_unsprung_accel = 5;
    repeated float fl_unsprung_accel = 6;
    repeated float fr_unsprung_accel = 7;
    float accel_pedal_travel = 8;
    float bl_wheel_speed = 9;
    float br_wheel_speed = 10;
    float fl_wheel_speed = 11;
    float fr_wheel_speed = 12;
    float steer_col_angle = 13;
    repeated float bl_gyro = 14;
    repeated float bl_sprung_accel = 15;
    repeated float br_gyro = 16;
    repeated float br_sprung_accel = 17;
    repeated float fl_gyro = 18;
    repeated float fl_sprung_accel = 19;
    repeated float fr_gyro = 20;
    repeated float fr_sprung_accel = 21;
    float bl_ride_height = 22;
    float bl_strain_gauge_v = 23;
    float bl_sus_pot_v = 24;
    float br_ride_height = 25;
    float br_strain_gauge_v = 26;
    float br_sus_pot_v = 27;
    float fl_ride_height = 28;
    float fl_strain_gauge_v = 29;
    float fl_sus_pot_v = 30;
    float fr_ride_height = 31;
    float fr_strain_gauge_v = 32;
    float fr_sus_pot_v = 33;
    float ride_height = 34;
    float wheel_speed = 35;
}

message OrionControls {
    float motor_speed = 1;
    float torque_feedback = 2;
    float apps1_travel = 3;
    float apps1_v = 4;
    float apps2_travel = 5;
    float apps2_v = 6;
    float bpps1_travel = 7;
    float bpps1_v = 8;
    float bpps2_travel = 9;
    float bpps2_v = 10;
    float brake_bias = 11;
    float brake_light_pct = 12;
    float brake_pressure_f = 13;
    float brake_pressure_rall = 14;
    float brake_pressure_rbll = 15;
    float bse1_v = 16;
    float bse2_v = 17;
    float bse3_v = 18;
    float lights_current = 19;
    float rpm_request = 20;
    float torque_command = 21;
    float torque_limit = 22;
    float torque_request = 23;
    float commanded_torque = 24;
    float motor_angle = 25;
    bool direction = 26;
    bool enable = 27;
    bool line_lock_enabled = 28;
    float torque_shudder = 29;
    float bse3 = 30;
}

message OrionPack {
    float bus_voltage = 1;
    float lv_boards_current = 2;
    float soc_estimate = 3;
    repeated float cells_v = 4;
    float dc_bus_v = 5;
    float delta_resolver_angle = 6;
    float inverter_freq = 7;
    float neutral_output_v = 8;
    float time_since_on = 9;
    float vab_vq_v = 10;
    float vbc_vd_v = 11;
    repeated float cells_temps = 12;
    float dc_bus_current = 13;
    float hv_c = 14;
    float hv_pack_v = 15;
    float hv_soc = 16;
    float lv_batt_c = 17;
    float lv_batt_t = 18;
    float lv_batt_v = 19;
    float phase_a_current = 20;
    float phase_b_current = 21;
    float phase_c_current = 22;
}

message OrionDiagnosticsHigh {
    float prndl_state = 1;
    float shutdown_current = 2;
    float hvc_state_machine = 3;
    float post_faults = 4;
    float run_faults = 5;
    bool apps1_disconnect = 6;
    bool apps1_out_range = 7;
    bool apps2_disconnect = 8;
    bool apps2_out_range = 9;
    bool apps_implause = 10;
    bool apps_mismatch = 11;
    bool batt_fans_fuse = 12;
    bool batt_pump_fuse = 13;
    bool boards_fuse = 14;
    bool bpps1_disconnect = 15;
    bool bpps1_out_range = 16;
    bool bpps2_disconnect = 17;
    bool bpps2_out_range = 18;
    bool bpps_mismatch = 19;
    bool brake_light_fuse = 20;
    bool bse1_disconnect = 21;
    bool bse1_out_range = 22;
    bool bse2_disconnect = 23;
    bool bse2_out_range = 24;
    bool ll_fuse = 25;
    bool motor_pump_fuse = 26;
    bool r2d_buzzer = 27;
    bool rtd_fuse = 28;
    bool shtdn_fuse = 29;
    bool shutdown_bspd_status = 30;
    bool shutdown_emeter_status = 31;
    bool spare_fuse = 32;
    bool stomp_fault = 33;
    bool tssi_green_fuse = 34;
    bool tssi_red_fuse = 35;
    bool neg_hv_contactor = 36;
    bool pos_hv_contactor = 37;
    bool precharge_contactor = 38;
}

message OrionDiagnosticsLow {
    float precharge_r_temp = 1;
    bool bmb_comm_error = 2;
    bool imd_gnd_isolation_error = 3;
    bool r2d_authorized = 4;
    bool r2d_status = 5;
    bool shutdown_leg1 = 6;
    bool shutdown_leg2 = 7;
    bool shutdown_leg3 = 8;
    bool shutdown_leg4 = 9;
    bool temp_imd_1 = 10;
    bool temp_imd_2 = 11;
    bool temp_shutdown_1 = 12;
    bool temp_shutdown_2 = 13;
}

message OrionThermal {
    float batt_cooling_current = 1;
    float motor_cooling_current = 2;
    float ambient_temp = 3;
    float motor_temp = 4;
    float batt_loop_batt_temp = 5;
    float batt_loop_rad_fan_speed = 6;
    float batt_loop_rad_temp = 7;
    float battery_fan_rpm = 8;
    float bus_bar_temp1 = 9;
    float bus_bar_temp2 = 10;
    float bus_bar_temp3 = 11;
    float cell_bottom_temp = 12;
    float cell_top_temp = 13;
    float coolant_flow_lpm = 14;
    float coolant_temp = 15;
    float discharge_r_temp = 16;
    float fan_rpm = 17;
    float gate_driver_temp = 18;
    float inverter_hotspot_temp = 19;
    float inverter_temp = 20;
    float max_cell_voltage = 21;
    float min_cell_voltage = 22;
    float module_a_temp = 23;
    float module_b_temp = 24;
    float module_c_temp = 25;
    float motor_loop_inverter_temp = 26;
    float motor_loop_motor_temp = 27;
    float motor_loop_rad_temp = 28;
    bool temp_ams_1 = 29;
